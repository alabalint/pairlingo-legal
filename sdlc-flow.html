<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PairLingo SDLC Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: two drawings of the same flow — a wide circuit board (left→right) for computers and a tall one (top→bottom) for phones; the script shows one. Dark phosphor look by choice. */
:root {
  --bg: #050D09;
  --board: #081510;
  --panel: #0C1C15;
  --line: #1D3D2D;
  --ink: #DDF6E8;
  --soft: #A3CDB6;
  --dim: #5F8E75;
  --green: #4FE39E;
  --opus: #CDB2FF;
  --haiku: #86D8FF;
  --amber: #FFB547;
  --amber-bg: #1D1509;
  --defect: #FF7FA0;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--sans); }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 20px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
figure { margin: 0; }
.bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
button.ctl { font: 600 13px/1 var(--mono); letter-spacing: .04em; color: var(--soft); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
button.ctl:hover { color: var(--ink); border-color: var(--green); }
button.ctl:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.frame { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--board); }
svg.flow { display: block; width: 100%; min-width: 1100px; height: auto; }
figcaption { margin-top: 12px; font-size: 15px; line-height: 1.5; color: var(--soft); max-width: 72ch; }

/* Phone layout */
.phone .frame { border-radius: 12px; }
svg.flow-m { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto; }
.phone { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.mbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(8,21,16,0.96); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mbar-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.mbar-row { display: flex; align-items: center; gap: 10px; }
.mstep { font: 600 14px var(--mono); color: var(--amber); }
.msay { font: 400 16px/1.4 var(--sans); color: var(--ink); min-height: 2.8em; }
.mbar .ctl { padding: 7px 12px; }
.mbar .spacer { flex: 1; }

/* SVG text */
.t-eyebrow { font: 600 15px var(--mono); letter-spacing: 3px; fill: var(--green); }
.t-title { font: 600 28px var(--sans); fill: var(--ink); }
.t-leg { font: 600 14px var(--mono); fill: var(--soft); }
.t-name { font: 600 17px var(--mono); fill: var(--ink); text-anchor: middle; }
.t-sub { font: 400 13px var(--mono); fill: var(--dim); text-anchor: middle; }
.t-note { font: 400 14px var(--mono); fill: var(--dim); }
.t-say { font: 400 19px var(--sans); fill: var(--ink); }
.t-step { font: 600 16px var(--mono); fill: var(--amber); }
.t-file { font: 400 13px var(--mono); fill: var(--dim); text-anchor: middle; transition: fill .3s; }
.t-gate { font: 800 15px var(--mono); fill: var(--amber); text-anchor: middle; }
.t-ok { font: 800 20px var(--mono); fill: var(--green); text-anchor: middle; opacity: 0; transition: opacity .25s; }
.t-tok { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; }
.flow-m .t-eyebrow { font-size: 13px; letter-spacing: 2px; }
.flow-m .t-title { font-size: 21px; }
.flow-m .t-leg { font-size: 13px; }
.flow-m .t-name { font-size: 16px; }
.flow-m .t-sub, .flow-m .t-file { font-size: 12.5px; }
.flow-m .t-gate { font-size: 14px; }

.trace { fill: none; stroke: var(--line); stroke-width: 2.5; }
.lane { fill: none; stroke: var(--dim); stroke-width: 1.6; stroke-dasharray: 5 7; opacity: .7; }
.defect-arc { fill: none; stroke: var(--defect); stroke-width: 1.8; stroke-dasharray: 5 6; opacity: .45; }
.bus-base { fill: none; stroke: #3A2A12; stroke-width: 1.6; stroke-dasharray: 3 6; }
.bus-hot { fill: none; stroke: var(--amber); stroke-width: 2.5; opacity: 0; }
.main-line { fill: none; stroke: var(--soft); stroke-width: 3; }
.branch { fill: none; stroke: var(--green); stroke-width: 2.5; }
.rel { fill: none; stroke: var(--dim); stroke-width: 2; }

.node rect { fill: var(--panel); stroke-width: 2; transition: stroke-width .3s, fill .3s; }
.m-sonnet rect { stroke: #2E7F59; }
.m-opus rect { stroke: #7C68A6; }
.m-haiku rect { stroke: #4E7F97; }
.m-plain rect { stroke: var(--line); }
.node.active rect { stroke-width: 3.5; fill: #10291D; filter: url(#glow); }
.m-sonnet.active rect { stroke: var(--green); }
.m-opus.active rect { stroke: var(--opus); fill: #1A1529; }
.m-haiku.active rect { stroke: var(--haiku); fill: #0F2230; }
.m-plain.active rect { stroke: var(--soft); }
/* progress bars live inside node groups: keep them out of the node's border/active styling */
.pbar-bg { fill: #0A1912 !important; stroke: none !important; filter: none !important; }
.pbar { fill: var(--green) !important; stroke: none !important; filter: none !important; }
.pbar-opus { fill: var(--opus) !important; }

.gate polygon { fill: var(--amber-bg); stroke: #8A6326; stroke-width: 2; transition: stroke .3s; }
.gate.waiting polygon { stroke: var(--amber); stroke-width: 3; filter: url(#glow); animation: pulse 900ms ease-in-out infinite alternate; }
.gate.ok .t-ok { opacity: 1; }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

.you rect { fill: var(--amber-bg); stroke: #8A6326; stroke-width: 2; }
.you .lamp { fill: #3A2A12; transition: fill .2s; }
.you.waiting rect { stroke: var(--amber); }
.you.waiting .lamp { fill: var(--amber); animation: pulse 500ms ease-in-out infinite alternate; }

.file rect { fill: var(--board); stroke: var(--line); stroke-width: 1.5; transition: fill .3s, stroke .3s; }
.file.lit rect { fill: #0F2A1E; stroke: var(--green); }
.file.lit .t-file { fill: var(--ink); }

.check { font: 600 13px var(--mono); fill: var(--green); text-anchor: middle; opacity: 0; transition: opacity .25s; }
.check.on { opacity: 1; }
.backlog-card { transition: transform .5s; }
.backlog-card.lift { transform: translate(0px, -14px); }
.flow-m .backlog-card.lift { transform: translate(0px, -8px); }
.mergedot { fill: var(--green); opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  .gate.waiting polygon, .you.waiting .lamp { animation: none; }
}
</style>
</head>

<figcaption>One backlog item through PairLingo’s agent workflow. Agents work and leave a file at every step; at the four amber gates the work waits for your decision.</figcaption>

<div class="mbar-in">
<div class="mbar-row"><span class="mstep" id="m-stepn">--/14</span><span class="spacer"></span><button type="button" class="ctl js-pause">Pause</button><button type="button" class="ctl js-restart">Restart</button></div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var TOTAL = 14;
  var P = 'd-';
  function $(id) { return document.getElementById(P + id); }

  // Virtual clock, so Pause really freezes everything mid-move.
  var clock = 0, last = performance.now(), paused = false, runId = 0;
  var waiters = [], tweens = [];
  function frame(now) {
    var dt = Math.min(now - last, 100); last = now;
    if (!paused) {
      clock += dt;
      for (var i = tweens.length - 1; i >= 0; i--) {
        var tw = tweens[i];
        var p = Math.min(1, (clock - tw.start) / tw.dur);
        tw.fn(tw.ease ? ease(p) : p);
        if (p >= 1) { tweens.splice(i, 1); tw.resolve(); }
      }
      for (var j = waiters.length - 1; j >= 0; j--) {
        if (clock >= waiters[j].at) { var w = waiters.splice(j, 1)[0]; w.resolve(); }
      }
      if (P === 'm-') follow(now);
    }
    requestAnimationFrame(frame);
  }
  function ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function wait(ms) { return new Promise(function (r) { waiters.push({ at: clock + ms, resolve: r }); }); }
  function tween(ms, fn, noEase) { return new Promise(function (r) { tweens.push({ start: clock, dur: ms, fn: fn, resolve: r, ease: !noEase }); }); }

  function bbox(id) { return $(id).getBBox(); }
  function center(id) { var b = bbox(id); return { x: b.x + b.width / 2, y: b.y + b.height / 2 }; }

  var focusEl = null;
  function token(label, color) {
    var g = document.createElementNS(NS, 'g');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', P === 'm-' ? '7' : '9'); c.setAttribute('fill', color || '#4FE39E'); c.setAttribute('filter', 'url(#glow)');
    g.appendChild(c);
    if (label) {
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 't-tok'); t.setAttribute('y', P === 'm-' ? '-12' : '-16'); t.textContent = label;
      if (P === 'm-') { t.setAttribute('x', '26'); t.setAttribute('y', '4'); t.style.textAnchor = 'start'; t.style.fontSize = '11px'; }
      g.appendChild(t);
    }
    $('tokens').appendChild(g);
    focusEl = g;
    return g;
  }
  function place(tok, x, y) { tok.setAttribute('transform', 'translate(' + x + ' ' + y + ')'); }
  function placeAt(tok, id) { var c = center(id); place(tok, c.x, c.y); }
  function move(tok, pathId, ms) {
    var path = $(pathId), len = path.getTotalLength();
    focusEl = tok;
    return tween(ms, function (p) { var pt = path.getPointAtLength(p * len); place(tok, pt.x, pt.y); });
  }
  function draw(el, ms) {
    var len = el.getTotalLength();
    el.style.strokeDasharray = len; el.style.strokeDashoffset = len; el.style.opacity = 1;
    return tween(ms, function (p) { el.style.strokeDashoffset = len * (1 - p); });
  }
  function on(id, cls) { $(id).classList.add(cls || 'active'); }
  function off(id, cls) { $(id).classList.remove(cls || 'active'); }
  function bar(id, ms) { var el = $(id), w = +el.getAttribute('data-w'); return tween(ms, function (p) { el.setAttribute('width', w * p); }, true); }

  function drop(i, fromId) {
    var src = bbox(fromId), dst = bbox('f' + i);
    var size = P === 'm-' ? [10, 13] : [14, 18];
    var g = document.createElementNS(NS, 'rect');
    g.setAttribute('width', size[0]); g.setAttribute('height', size[1]); g.setAttribute('rx', '2');
    g.setAttribute('fill', '#4FE39E'); g.setAttribute('filter', 'url(#glow)');
    $('tokens').appendChild(g);
    var x0 = src.x + src.width / 2 - size[0] / 2, y0 = src.y + src.height;
    var x1 = dst.x + dst.width / 2 - size[0] / 2, y1 = dst.y + dst.height / 2 - size[1] / 2;
    return tween(650, function (p) {
      g.setAttribute('x', x0 + (x1 - x0) * p); g.setAttribute('y', y0 + (y1 - y0) * p);
    }).then(function () { g.remove(); on('f' + i, 'lit'); });
  }
  function say(n, text) { $('stepn').textContent = (n < 10 ? '0' : '') + n + '/' + TOTAL; $('say').textContent = text; }

  // Phone: keep the moving task in view, unless the viewer is scrolling by hand.
  var userScrollUntil = 0, lastFollow = 0;
  ['touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, function () { userScrollUntil = performance.now() + 6000; }, { passive: true });
  });
  function follow(now) {
    if (!focusEl || !focusEl.isConnected || now < userScrollUntil || now - lastFollow < 350) return;
    lastFollow = now;
    var r = focusEl.getBoundingClientRect();
    var barH = document.querySelector('.mbar').offsetHeight;
    var viewH = window.innerHeight - barH;
    var y = r.top + r.height / 2;
    if (y < viewH * 0.25 || y > viewH * 0.7) {
      window.scrollTo({ top: Math.max(0, window.scrollY + y - viewH * 0.45), behavior: 'smooth' });
    }
  }

  async function gate(i) {
    on('g' + i, 'waiting'); on('you', 'waiting');
    await draw($('bus' + i), 500);
    await wait(900);
    off('g' + i, 'waiting'); on('g' + i, 'ok'); off('you', 'waiting');
    await wait(250);
    $('bus' + i).style.opacity = 0;
  }

  var NODES = ['n-ba','n-arch','n-d1','n-d2','n-d3','n-int','n-run','n-qa','n-doc0','n-doc1','n-doc2','n-doc3','n-pr'];
  function reset() {
    $('tokens').innerHTML = '';
    NODES.forEach(function (id) { off(id); });
    for (var i = 0; i < 4; i++) { off('g' + i, 'waiting'); off('g' + i, 'ok'); $('bus' + i).style.opacity = 0; }
    off('you', 'waiting');
    for (var f = 0; f < 7; f++) off('f' + f, 'lit');
    ['pb1','pb2','pb3'].forEach(function (id) { $(id).setAttribute('width', 0); });
    off('c-t0', 'on'); off('c-t1', 'on');
    $('card5').classList.remove('lift');
    var br = $('branchline'), len = br.getTotalLength();
    br.style.strokeDasharray = len; br.style.strokeDashoffset = len;
    $('mergedot').style.opacity = 0; $('mergering').setAttribute('opacity', 0);
  }
  function finalState() {
    reset();
    for (var i = 0; i < 4; i++) on('g' + i, 'ok');
    for (var f = 0; f < 7; f++) on('f' + f, 'lit');
    ['pb1','pb2','pb3'].forEach(function (id) { $(id).setAttribute('width', $(id).getAttribute('data-w')); });
    on('c-t0', 'on'); on('c-t1', 'on');
    $('branchline').style.strokeDashoffset = 0;
    $('mergedot').style.opacity = 1;
    $('stepn').textContent = '14/14';
    $('say').textContent = 'Still view: every gate passed, every file written, PL-005 merged into main. Press Restart to watch it move.';
  }

  async function sequence(id) {
    function alive() { return id === runId; }
    while (alive()) {
      reset();
      if (P === 'm-') window.scrollTo({ top: 0, behavior: 'smooth' });
      say(1, 'PL-005 leaves the backlog, and a feature branch splits off main.');
      on('card5', 'lift');
      var t = token('PL-005'); placeAt(t, 'card5');
      await Promise.all([draw($('branchline'), 900), drop(0, 'card5')]);
      if (!alive()) return;

      say(2, 'The BA (Sonnet) turns the idea into a testable spec.');
      await move(t, 'p-a', 700); on('n-ba'); await wait(900); off('n-ba');
      await drop(1, 'n-ba'); if (!alive()) return;

      say(3, 'Gate G1: the work waits until you approve the spec.');
      await move(t, 'p-b', 500); await gate(0); if (!alive()) return;

      say(4, 'The Architect (Opus) designs the change and splits it into parallel tasks.');
      await move(t, 'p-c', 500); on('n-arch'); await wait(1100); off('n-arch');
      await drop(2, 'n-arch'); if (!alive()) return;

      say(5, 'Gate G2: you approve the design.');
      await move(t, 'p-d', 500); await gate(1); if (!alive()) return;

      say(6, 'Three developers work at once, each in its own worktree. The high-risk task gets Opus.');
      t.remove();
      var d1 = token('T1'), d2 = token('T2'), d3 = token('T3', '#CDB2FF');
      focusEl = d2;
      await Promise.all([move(d1, 'p-e1', 900), move(d2, 'p-e2', 900), move(d3, 'p-e3', 900)]);
      on('n-d1'); on('n-d2'); on('n-d3');
      await Promise.all([bar('pb1', 1300), bar('pb2', 1700), bar('pb3', 2100)]);
      off('n-d1'); off('n-d2'); off('n-d3');
      await drop(3, 'n-d3'); if (!alive()) return;

      say(7, 'Integration: the Conductor merges the task branches, then builds (T0) and runs unit tests (T1).');
      await Promise.all([move(d1, 'p-f1', 900), move(d2, 'p-f2', 900), move(d3, 'p-f3', 900)]);
      d1.remove(); d2.remove(); d3.remove();
      t = token('PL-005'); placeAt(t, 'n-int');
      on('n-int'); await wait(500); on('c-t0', 'on'); await wait(500); on('c-t1', 'on'); await wait(400); off('n-int');
      if (!alive()) return;

      say(8, 'QA writes tests for every acceptance criterion; the runner (Haiku) executes them.');
      await move(t, 'p-g', 600); on('n-qa'); on('n-run'); await wait(1300); off('n-run');
      if (!alive()) return;

      say(9, 'A defect: QA sends it back to the developer who owns that task.');
      t.remove(); var bug = token('defect', '#FF7FA0'); placeAt(bug, 'n-qa');
      await move(bug, 'p-defect', 1400); bug.remove(); off('n-qa');
      on('n-d3'); $('pb3').setAttribute('width', 0); await bar('pb3', 900); off('n-d3');
      if (!alive()) return;

      say(10, 'Fixed, re-integrated and re-tested. QA writes its report.');
      t = token('T3', '#CDB2FF'); placeAt(t, 'n-d3');
      await move(t, 'p-f3', 800); t.remove(); t = token('PL-005'); placeAt(t, 'n-int');
      on('n-int'); await wait(400); off('n-int');
      await move(t, 'p-g', 500); on('n-qa'); on('n-run'); await wait(700); off('n-run'); off('n-qa');
      await drop(4, 'n-qa'); if (!alive()) return;

      say(11, 'Gate G3: you accept the QA report and do the manual checks on real devices.');
      await move(t, 'p-h', 500); await gate(2); if (!alive()) return;

      say(12, 'Docs in parallel: user guide, architecture, release notes in six languages; limits checked.');
      t.remove();
      var docs = [token(''), token(''), token(''), token('', '#86D8FF')];
      focusEl = docs[1];
      await Promise.all(docs.map(function (d, k) { return move(d, 'p-i' + k, 800); }));
      [0,1,2,3].forEach(function (k) { on('n-doc' + k); });
      await wait(900); await drop(5, 'n-doc3');
      [0,1,2,3].forEach(function (k) { off('n-doc' + k); });
      await Promise.all(docs.map(function (d, k) { return move(d, 'p-o' + k, 800); }));
      docs.forEach(function (d) { d.remove(); });
      t = token('PL-005'); placeAt(t, 'g3');
      if (!alive()) return;

      say(13, 'Gate G4: you approve the push and the pull request opens.');
      await gate(3); await move(t, 'p-j', 500); on('n-pr'); await drop(6, 'n-pr');
      if (!alive()) return;

      say(14, 'You approve the merge. PL-005 lands on main, and the next item can start.');
      await wait(500); off('n-pr');
      await move(t, 'p-k', 1000); t.remove();
      $('mergedot').style.opacity = 1;
      var ring = $('mergering');
      var r0 = +ring.getAttribute('r');
      await tween(900, function (p) { ring.setAttribute('r', r0 + 30 * p); ring.setAttribute('opacity', 1 - p); });
      ring.setAttribute('r', r0);
      await wait(2200);
    }
  }

  // Layout choice: phones (either orientation) get the tall drawing; computers the wide one.
  function phoneLike() {
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var shortSide = Math.min(screen.width || 9999, screen.height || 9999);
    return (coarse && shortSide <= 600) || window.innerWidth <= 640;
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pauseBtns = document.querySelectorAll('.js-pause');
  function setPauseLabel() { pauseBtns.forEach(function (b) { b.textContent = paused ? 'Play' : 'Pause'; }); }

  function start() {
    runId++; waiters = []; tweens = []; paused = false; setPauseLabel();
    sequence(runId);
  }
  function applyLayout(first) {
    var phone = phoneLike();
    var nextP = phone ? 'm-' : 'd-';
    if (!first && nextP === P) return;
    P = nextP;
    document.getElementById('desk').hidden = phone;
    document.getElementById('mob').hidden = !phone;
    runId++;
    if (reduce && first) { finalState(); paused = true; setPauseLabel(); }
    else { start(); }
  }
  pauseBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      if (reduce && paused && clock === 0) { start(); return; }
      paused = !paused; setPauseLabel();
    });
  });
  document.querySelectorAll('.js-restart').forEach(function (b) { b.addEventListener('click', start); });
  var resizeTimer = null;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { applyLayout(false); }, 250); });

  requestAnimationFrame(function (now) { last = now; frame(now); });
  applyLayout(true);
})();
</script>
